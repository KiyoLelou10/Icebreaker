spring.application.name=ChatBackend
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG
logging.level.org.springframework.messaging.simp=DEBUG
logging.level.org.springframework.messaging.handler.annotation.MessageMapping=DEBUG


# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/IcebreakerDb
spring.datasource.username=postgresuser
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/IceBreaker