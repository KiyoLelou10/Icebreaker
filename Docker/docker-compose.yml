version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: icebreaker_postgres
    restart: always
    environment:
      POSTGRES_DB: IcebreakerDb
      POSTGRES_USER: postgresuser
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  keycloak:
    build:
      context: .
      dockerfile: ./KeycloakFiles/Dockerfile 
    container_name: keycloak_server
    restart: always
    environment:
      DB_VENDOR: postgres
      DB_ADDR: postgres
      DB_DATABASE: IcebreakerDb
      DB_USER: postgresuser
      DB_PASSWORD: root
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
    ports:
      - "8081:8080"  
    depends_on:
      - postgres
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network: