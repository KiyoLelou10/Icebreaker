<mat-toolbar color="primary">
  <span>Ice Breaker</span>
  <span class="spacer"></span>
  <button
    mat-button
    routerLink="/Home"
    routerLinkActive="active-link"
    [routerLinkActiveOptions]="{ exact: true }"
  >
    <mat-icon>people</mat-icon>
    Users
  </button>
  <button
    mat-button
    (click)="onChatOverview()"
    routerLinkActive="active-link"
    [routerLinkActiveOptions]="{ exact: true }"
  >
    <mat-icon>chat</mat-icon>
    Chats
  </button>
  <button mat-button (click)="completeProfile()"
            matBadge="!"
            matBadgeColor="warn"
            matBadgePosition="above after"
            [matBadgeHidden]="profileCompleted">
  <mat-icon>account_circle</mat-icon>
    {{ profileCompleted ? 'Change Profile' : 'Complete Profile' }}
</button>

  <button
    mat-button
    class="navbar-search-button"
    routerLink="/searchUser"
    (click)="onSearch()"
    routerLinkActive="active-link"
    [routerLinkActiveOptions]="{ exact: true }"
  >
    <mat-icon>search</mat-icon>
    <span class="button-text">Users</span>
  </button>

  <mat-menu #userMenu="matMenu">

    <button mat-menu-item (click)="logout()">
      <mat-icon>exit_to_app</mat-icon>
      Logout
    </button>
  </mat-menu>
  <button mat-button [matMenuTriggerFor]="userMenu">
    <mat-icon>account_circle</mat-icon>
    {{ username }}
  </button>
</mat-toolbar>
