<div *ngIf="profile" class="user-status-container mat-elevation-z4">
  <!-- Profile Section -->
  <div class="profile">
    <img
      [src]="profile.profilePhoto || defaultPhoto"
      alt="Profile Photo"
      class="profile-photo"
    />
    <div class="status-indicator" [ngClass]="profile.status.toLowerCase()"></div>
    <div class="profile-info">
      <p class="username">{{ profile.username }}</p>
      <p class="status-text">
        {{ profile.status === 'ONLINE'
        ? 'You’re online! Let the world know you’re here to connect.'
        : 'You’ve chosen privacy, but your connections are still open.' }}
      </p>
    </div>
  </div>

  <!-- Status Toggle Section -->
  <div class="status-toggle">
    <mat-slide-toggle
      [(ngModel)]="isActive"
      (change)="toggleStatus($event)"
      color="primary"
    >
      {{ isActive ? 'Active' : 'Offline' }}
    </mat-slide-toggle>
  </div>
</div>

<div *ngIf="!profile" class="loading">
  <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
  <p>Loading profile...</p>
</div>
