<div *ngIf="profile" class="user-status-container mat-elevation-z4">
  <div class="profile">
    <img
      [src]="profile.profilePhoto || defaultPhoto"
      alt="Profile Photo"
      class="profile-photo"
    />
    <div class="status-indicator" [ngClass]="profile.status.toLowerCase()"></div>
  </div>
  <div class="status-toggle">
    <mat-slide-toggle
      [(ngModel)]="isActive"
      (change)="toggleStatus($event)"
      color="primary"
    >
      {{ isActive ? 'Active' : 'Offline' }}
    </mat-slide-toggle>
  </div>
</div>

<div *ngIf="!profile" class="loading">
  <p>Loading profile...</p>
</div>
