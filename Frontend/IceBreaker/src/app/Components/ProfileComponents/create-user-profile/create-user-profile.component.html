<div class="profile-container mat-elevation-z4">
  <div class="profile-header">
    <h2>User Profile</h2>
    <button mat-icon-button color="primary" (click)="toggleEditMode()">
      <mat-icon>{{ isEditing ? 'cancel' : 'edit' }}</mat-icon>
    </button>
  </div>

  <form class="profile-form" [formGroup]="profileForm">
    <mat-form-field appearance="fill" class="form-field">
      <mat-label>Username</mat-label>
      <input matInput formControlName="userName" [readonly]="!isEditing" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="form-field">
      <mat-label>Bio</mat-label>
      <textarea matInput formControlName="bio" [readonly]="!isEditing"></textarea>
    </mat-form-field>

    <mat-form-field appearance="fill" class="form-field">
      <mat-label>Age</mat-label>
      <input matInput type="number" formControlName="age" [readonly]="!isEditing" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="form-field">
      <mat-label>Gender</mat-label>
      <mat-select formControlName="gender" [disabled]="!isEditing">
        <mat-option value="Male">Male</mat-option>
        <mat-option value="Female">Female</mat-option>
        <mat-option value="Diverse">Diverse</mat-option>
      </mat-select>
    </mat-form-field>

    <div class="profile-photo-section">
      <img *ngIf="profileForm.value?.profilePhoto" [src]="profileForm.value?.profilePhoto" alt="Profile Photo" class="profile-photo" />
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Profile Photo URL</mat-label>
        <input matInput formControlName="profilePhoto" [readonly]="!isEditing" />
      </mat-form-field>
    </div>

    <button mat-raised-button color="primary" *ngIf="isEditing" (click)="saveProfile()">Save</button>
  </form>
</div>
