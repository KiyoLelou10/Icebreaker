<app-user-status> </app-user-status>
<div class="users-container">
  <mat-card class="header-card">
    <h2 class="header-title">Available Users</h2>
  </mat-card>

  <div class="users-list">
    <mat-card
      class="user-item"
      *ngFor="let user of currentUsers"
      (click)="openChat(user.id)"
      matRipple
    >
      <div class="user-content">
        <div class="avatar-container">
          <img
            class="user-avatar"
            [src]="user.profilePhoto || 'assets/default-profile.png'"
            alt="{{ user.userName }}"
          />
          <div class="status-indicator" [ngClass]="user.status.toLowerCase()"></div>
        </div>

        <div class="user-details">
          <h3 class="user-name">{{ user.userName }}</h3>
          <p class="user-bio">{{ user.bio || 'No bio available' }}</p>
        </div>
      </div>
    </mat-card>
  </div>

  <div *ngIf="availableUsers.length === 0" class="no-users-container">
    <p class="no-users-message">
      No New users online now. Come again later! <span class="sad-emoji">😔</span>
    </p>
  </div>
</div>

<!-- Navigation Buttons Moved Outside the Component -->
<div class="navigation-buttons">
  <button class="nav-button left-button" (click)="previousPage()" [disabled]="currentPageIndex === 0">
    &lt;
  </button>
  <button class="nav-button right-button" (click)="nextPage()" [disabled]="currentPageIndex === paginatedUsers.length - 1">
    &gt;
  </button>
</div>
